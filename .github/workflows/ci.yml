name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest --cov=app --cov-report=term-missing -q

  backend-postgres:
    name: Migrations and PostgreSQL tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: evidenceai
          POSTGRES_PASSWORD: evidenceai
          POSTGRES_DB: evidenceai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evidenceai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://evidenceai:evidenceai@localhost:5432/evidenceai
      EMBEDDING_PROVIDER: hash
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Apply migrations to an empty database
        run: alembic upgrade head
      - name: Check the models and migrations agree
        run: alembic check
      - name: Real-SQL tests (search, isolation, end-to-end benchmark)
        run: RUN_PG_TESTS=1 pytest tests/test_retrieval_postgres.py tests/test_eval_postgres.py -v

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    name: Production images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the production compose file
        run: |
          cp .env.production.example .env.production
          docker compose --env-file .env.production -f docker-compose.prod.yml config -q
      - run: docker build -f backend/Dockerfile.prod backend
      - run: docker build -f frontend/Dockerfile.prod frontend

  retrieval-quality:
    name: Retrieval quality gate (real embedding model)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: evidenceai
          POSTGRES_PASSWORD: evidenceai
          POSTGRES_DB: evidenceai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evidenceai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://evidenceai:evidenceai@localhost:5432/evidenceai
      EMBEDDING_PROVIDER: sentence_transformers
      LLM_PROVIDER: extractive
      UPLOAD_DIR: ${{ github.workspace }}/uploads
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies (CPU-only PyTorch)
        run: |
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-ml.txt
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-small-en-v1.5
      - run: alembic upgrade head
      - name: Run the benchmark and enforce the quality bar
        run: python -m app.evaluation.run --check --output eval-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-report
          path: backend/eval-report.json
